name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Verify and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare fonts and launcher icons
        run: python3 tools/prepare_assets.py

      - name: Import project and check GDScript syntax
        run: godot --headless --path . --editor --import

      - name: Gameplay smoke test
        run: godot --headless --path . --script res://tests/smoke.gd

      - name: Set Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create temporary debug signing key
        run: |
          mkdir -p build
          keytool -genkeypair -keystore "$RUNNER_TEMP/kady-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/kady-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$RUNNER_TEMP/kady-debug.keystore" /tmp/kady-debug.keystore
          godot --headless --path . --export-debug "Android" build/kadys-glyph-quest-v0.2.0-debug.apk
          test -s build/kadys-glyph-quest-v0.2.0-debug.apk

      - name: Add legacy and modern APK signatures
        run: |
          APK="build/kadys-glyph-quest-v0.2.0-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign \
            --ks "$RUNNER_TEMP/kady-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

      - name: Verify APK signatures and Android metadata
        run: |
          APK="build/kadys-glyph-quest-v0.2.0-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee build/signatures.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/signatures.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' build/signatures.txt
          # Android 7+ chooses v2/v3 during verification. Force a pre-v2
          # platform level to test whether the JAR/v1 signature also works.
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --min-sdk-version 23 "$APK" | tee build/legacy-signatures.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' build/legacy-signatures.txt
          jarsigner -verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Make APK available to testers
        uses: actions/upload-artifact@v4
        with:
          name: Kady-Glyph-Quest-Android-v0.2.0
          path: build/kadys-glyph-quest-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30