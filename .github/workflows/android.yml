name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Verify and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Prepare fonts and launcher icons
        run: python3 tools/prepare_assets.py

      - name: Import project and check GDScript syntax
        run: |
          mkdir -p build
          godot --headless --path . --editor --import 2>&1 | tee build/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" build/import.log; then exit 1; fi

      - name: Gameplay smoke test
        run: |
          timeout 50s godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee build/smoke.log
          grep -q "PASS: 8x8 match-three" build/smoke.log
          if grep -E "SCRIPT ERROR|SMOKE FAIL" build/smoke.log; then exit 1; fi

      - name: Capture actual Godot screens for visual QA
        run: |
          mkdir -p build/visual
          timeout 35s xvfb-run -a -s "-screen 0 1024x2000x24" godot --path . --resolution 720x1440 --rendering-method gl_compatibility --script res://tools/capture.gd
          test -s build/visual/menu.png
          test -s build/visual/runes.png
          test -s build/visual/settings.png
          test -s build/visual/victory.png

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kady-Glyph-Quest-Visual-v0.3.0
          path: build/visual/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Set Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create temporary debug signing key
        run: |
          mkdir -p build
          keytool -genkeypair -keystore "$RUNNER_TEMP/kady-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/kady-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$RUNNER_TEMP/kady-debug.keystore" /tmp/kady-debug.keystore
          godot --headless --path . --export-debug "Android" build/kadys-glyph-quest-v0.3.0-debug.apk
          test -s build/kadys-glyph-quest-v0.3.0-debug.apk

      - name: Add legacy and modern APK signatures
        run: |
          APK="build/kadys-glyph-quest-v0.3.0-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign \
            --ks "$RUNNER_TEMP/kady-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

      - name: Verify APK signatures and Android metadata
        run: |
          APK="build/kadys-glyph-quest-v0.3.0-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee build/signatures.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/signatures.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' build/signatures.txt
          # Android 7+ chooses v2/v3 during verification. Force a pre-v2
          # platform level to test whether the JAR/v1 signature also works.
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --min-sdk-version 23 "$APK" | tee build/legacy-signatures.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' build/legacy-signatures.txt
          jarsigner -verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK installs on a fresh Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install --no-incremental build/kadys-glyph-quest-v0.3.0-debug.apk
            adb shell pm path com.nefariousmedia.kadysglyphquest

      - name: Make APK available to testers
        uses: actions/upload-artifact@v4
        with:
          name: Kady-Glyph-Quest-Android-v0.3.0
          path: build/kadys-glyph-quest-v0.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30