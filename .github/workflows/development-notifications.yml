name: Development Notifications

on:
  push:
    branches: [main, develop]
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  release:
    types: [published]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROJECT_LABEL: "Kady's Glyph Quest"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFY_BASE_URL: ${{ vars.NOTIFY_BASE_URL || 'https://ntfy.sh' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send ntfy message
        run: python3 .github/scripts/github-ntfy.py
